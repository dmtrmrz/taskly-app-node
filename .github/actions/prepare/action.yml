name: Prepare unit test agent workspace
description: Replace agent config and CI scripts with the base branch version, set up Node and optionally install both stacks.

inputs:
  base:
    description: Base ref, e.g. origin/main
    required: true
  install:
    description: Install backend and frontend dependencies
    default: "true"

runs:
  using: composite
  steps:
    # The agent and every check run with the reviewed config from the base branch, never the PR's own copy:
    # files the PR adds there are removed, not just the changed ones reverted.
    - name: Use trusted agent config from ${{ inputs.base }}
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        {
          printf '%s\n' .claude .github/scripts .mcp.json
          git ls-files '*CLAUDE.md' '*CLAUDE.local.md'
          git ls-tree -r --name-only "$BASE" | grep -E '(^|/)CLAUDE(\.local)?\.md$' || true
        } | sort -u | while IFS= read -r path; do
          rm -rf -- "$path"
          if git cat-file -e "$BASE:$path" 2>/dev/null; then git checkout "$BASE" -- "$path"; fi
        done
        git add -A
        if ! git diff --cached --quiet; then
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: trusted agent config from $BASE"
          echo "::notice::This PR changes .claude or .github/scripts; the agent runs with the $BASE version."
        fi

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: ${{ inputs.install == 'true' && 'npm' || '' }}
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install dependencies without lifecycle scripts
      if: inputs.install == 'true'
      shell: bash
      run: |
        (cd backend && npm ci --ignore-scripts && node_modules/.bin/prisma generate)
        (cd frontend && npm ci --ignore-scripts)
